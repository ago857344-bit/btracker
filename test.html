<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: url('https://picsum.photos/1000/1000') center/cover fixed;
    margin: 0;
    height: 200vh;
  }
  .widget {
    margin: 50px;
    padding: 20px;
    background: red;
    color: white;
    font-size: 40px;
  }
  .modal {
    position: fixed;
    top: 50px; left: 50px; right: 50px; bottom: 50px;
    background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://picsum.photos/1000/1000');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    border: 2px solid white;
    color: white;
    padding: 20px;
  }
</style>
</head>
<body>
  <div class="widget">Widgets behind the modal!</div>
  <div class="modal">Modal Content (Widgets should be hidden, but background aligns!)</div>
</body>
</html>
