[package]
name = "btracker-next"
version = "0.1.0"
description = "A modern JEE study tracker"
authors = ["BTracker Next"]
edition = "2021"

[lib]
name = "btracker_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
